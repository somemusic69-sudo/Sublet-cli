name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    defaults:
      run:
        working-directory: agent-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agent-cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  package:
    name: npm package smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-cli/package-lock.json
      - name: Install and build
        working-directory: agent-cli
        run: |
          npm ci
          npm run build
      - name: Pack and install the published artifact
        working-directory: agent-cli
        run: |
          npm pack --silent
          npm install --prefix /tmp/sublet-pkg "file:$(ls sublet-cli-*.tgz)"
          node /tmp/sublet-pkg/node_modules/sublet-cli/dist/index.js --version
