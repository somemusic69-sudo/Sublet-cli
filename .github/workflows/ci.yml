name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A stuck test fails the job in minutes instead of holding a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.18.1
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    defaults:
      run:
        working-directory: agent-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agent-cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The same tests as `npm test`; failures also become annotations on the run page.
      - run: node --import tsx --test --test-timeout=120000 --test-force-exit --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/gh-reporter.mjs --test-reporter-destination=stdout "tests/*.test.ts"
      - run: npm run build
      - run: node scripts/check-package.mjs
      - run: npm audit --omit=dev

  package:
    name: npm package smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-cli/package-lock.json
      - name: Install and build
        working-directory: agent-cli
        run: |
          npm ci
          npm run build
      - name: Pack and install the published artifact
        working-directory: agent-cli
        run: |
          npm pack --silent
          npm install --prefix /tmp/sublera-pkg "file:$(ls sublera-cli-*.tgz)"
          /tmp/sublera-pkg/node_modules/.bin/sublera --version
          /tmp/sublera-pkg/node_modules/.bin/sublet --version
          node /tmp/sublera-pkg/node_modules/sublera-cli/dist/index.js config --json > /dev/null
          ! ls /tmp/sublera-pkg/node_modules/sublera-cli/dist/*.map 2>/dev/null
