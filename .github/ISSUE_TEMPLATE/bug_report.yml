name: Bug report
description: Report a failure in the terminal agent
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include host keys, prompts, model contents, or private paths.
        Replace them with `kh_...` / `C:\path\to\...`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did the agent do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command, request state (idle/loading/booking), and steps.
      placeholder: |
        kiln start ...
        1. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent version
      placeholder: "kiln --version"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and GPU
      placeholder: "Windows 11, RTX 4060 8GB"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.14.0"
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Run with `--verbose` if useful. Remove tokens and private data.
      render: text
