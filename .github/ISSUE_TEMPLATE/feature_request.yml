name: Feature request
description: Suggest an improvement to hosting, recovery, security, or the dashboard
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the host or buyer situation, not just the UI change.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should `sublera` do differently?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - overnight reliability / recovery
        - model download / verification
        - llama.cpp engine
        - tunnel / networking
        - dashboard / CLI UX
        - security
        - packaging / install
        - other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
